repos:
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args: [--in-place]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.2
    hooks:
      - id: clang-format
        # The upstream hook claims javascript and json alongside the C family
        # (types_or: [c++, c, c#, cuda, java, javascript, json, objective-c, proto, ...]), and
        # clang-format does not merely restyle JavaScript — it reformats it with C++ rules and
        # joins statements, which left .claude/workflows/rockhero-deep-review.js syntactically
        # INVALID (`const x = [] for (...)`) and silently broken. This project formats only C and
        # C++ with clang-format, so it should claim only those.
        types_or: [c, c++]
  - repo: local
    hooks:
      - id: verify-project-conventions
        name: verify project conventions
        entry: python scripts/verify-project-conventions.py
        language: system
        pass_filenames: false
        always_run: true
